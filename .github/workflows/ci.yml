name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff pytest-cov pip-audit

      - name: Ruff (critical errors only)
        run: python -m ruff check app bot.py --select F821,F811

      - name: pip-audit (pinned requirements)
        run: python -m pip_audit -r requirements.txt

      - name: Tests with coverage (fail under 70%)
        run: python -m pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  contract:
    name: Contract (API drift gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Route matrix + drift check
        run: |
          python audit/scripts/route_matrix.py
          python audit/scripts/check_api_drift.py
