services:
  - type: web
    name: crm-tg-miniapp
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TZ
        value: Europe/Moscow
      - key: APP_ENV
        value: production
      - key: ALLOW_DEMO_SEED_DATA
        value: false
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: 300
      - key: DATABASE_SSLMODE
        value: require
      - key: PERSISTENT_DATA_DIR
        value: /data
      - key: UPLOADS_ENABLED
        value: false
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: RUN_EMBEDDED_BOT
        value: true
      - key: ALLOW_INSECURE_CLIENT_AUTH
        value: false
      - key: APP_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
