# Pre-commit: быстрая локальная гигиена (зеркалит CI-гейты).
# Установка: pip install pre-commit && pre-commit install
# Проектная карта (PROJECT_MAP.md) обновляется отдельно:
# вотчером scripts\start-project-map-watch.vbs и git-хуком .git/hooks/pre-commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1500']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Те же критические правила, что в CI (F821/F811).
      - id: ruff
        args: ['--select', 'F821,F811', '--force-exclude']
        files: ^backend/
